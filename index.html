<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App | Karunya</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="weather-card">
        <h1>🌤️ Weather App</h1>
        <p class="subtitle">Get real-time weather for any city</p>

        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name (e.g., London, Mumbai, New York)" onkeypress="handleKeyPress(event)">
            <button onclick="getWeather()">Search</button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
        </div>

        <div class="weather-info" id="weatherInfo">
            <div class="city-name" id="cityName"></div>
            <div class="temp" id="temperature"></div>
            <img class="weather-icon" id="weatherIcon" alt="Weather icon">
            <div class="condition" id="condition"></div>
            <div class="details">
                <div class="detail-card">
                    <div class="detail-label">🌡️ Feels Like</div>
                    <div class="detail-value" id="feelsLike"></div>
                </div>
                <div class="detail-card">
                    <div class="detail-label">💧 Humidity</div>
                    <div class="detail-value" id="humidity"></div>
                </div>
                <div class="detail-card">
                    <div class="detail-label">💨 Wind Speed</div>
                    <div class="detail-value" id="windSpeed"></div>
                </div>
            </div>
        </div>

        <div class="error-message" id="errorMessage"></div>
        <footer>Data from OpenWeatherMap | Built by Karunya</footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
